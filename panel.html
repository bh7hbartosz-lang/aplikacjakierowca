<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Dyspozytora - MPK</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151b26;
      --accent: #ff8c00;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --border: #212936;
      --green: #2ea043;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 25px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    header h1 { color: var(--accent); font-size: 24px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .card h2 { color: var(--accent); font-size: 16px; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

    label { display: block; font-size: 12px; color: var(--text-dim); margin: 12px 0 4px 0; font-weight: bold; }
    input, select { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 13px; }

    .btn { background: var(--accent); color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 15px; }

    .notif-box { background: var(--bg); border: 1px solid var(--border); padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 12px; border-left: 3px solid var(--accent); }
  </style>
</head>
<body>

  <header>
    <h1>Centrala Dyspozytorska MPK</h1>
    <span style="font-size: 12px; color: var(--text-dim);">System Zarządzania v2.0</span>
  </header>

  <div class="grid">
    <!-- SEKCJA POWIADOMIEŃ OD KIEROWCÓW -->
    <div class="card" style="grid-column: span 2;">
      <h2>🔔 Powiadomienia / Prośby od Kierowców</h2>
      <button class="btn" style="margin-top: 0; margin-bottom: 10px; width: auto; padding: 6px 12px; font-size: 11px;" onclick="odswiezZgloszenia()">Odśwież Powiadomienia</button>
      <div id="lista-zgloszen"><div style="color: var(--text-dim); font-size: 12px;">Brak nowych zgłoszeń.</div></div>
    </div>

    <!-- DODAWANIE KIEROWCY -->
    <div class="card">
      <h2>1. Dodaj Kierowcę</h2>
      <label>Imię i Nazwisko:</label>
      <input type="text" id="k-name" placeholder="np. Jan Kowalski">
      <label>Login:</label>
      <input type="text" id="k-login" placeholder="np. kowalski102">
      <button class="btn" onclick="dodajKierowce()">Stwórz Konto</button>
    </div>

    <!-- PRZYPISYWANIE GRAFIKU -->
    <div class="card">
      <h2>2. Przypisz Grafik</h2>
      <label>Kierowca:</label>
      <select id="g-kierowca"></select>
      <label>Dzień Miesiąca:</label>
      <input type="number" id="g-dzien" value="9" min="1" max="31">
      <label>Linia:</label>
      <input type="text" id="g-linia" value="161">
      <button class="btn" onclick="zapiszGrafik()">Zapisz w Grafiku</button>
    </div>
  </div>

  <script>
    function getDB() { return JSON.parse(localStorage.getItem('mpk_db_v2')) || { kierowcy: {}, grafiki: {}, zgloszenia: [] }; }
    function saveDB(db) { localStorage.setItem('mpk_db_v2', JSON.stringify(db)); odswiez(); }

    function dodajKierowce() {
      const name = document.getElementById('k-name').value.trim();
      const login = document.getElementById('k-login').value.trim().toLowerCase();
      if (!name || !login) return alert('Wpisz dane!');

      const db = getDB();
      db.kierowcy[login] = { nazwa: name, login: login };
      saveDB(db);
      alert('Dodano kierowcę!');
    }

    function zapiszGrafik() {
      const k = document.getElementById('g-kierowca').value;
      const dzien = document.getElementById('g-dzien').value;
      const linia = document.getElementById('g-linia').value;

      const db = getDB();
      if (!db.grafiki[k]) db.grafiki[k] = {};
      db.grafiki[k][dzien] = { linia: linia, kolek: 4 };
      saveDB(db);
      alert('Grafik zapisany!');
    }

    function odswiezZgloszenia() {
      const db = getDB();
      const container = document.getElementById('lista-zgloszen');
      container.innerHTML = '';

      if (!db.zgloszenia || db.zgloszenia.length === 0) {
        container.innerHTML = '<div style="color: var(--text-dim); font-size: 12px;">Brak nowych zgłoszeń.</div>';
        return;
      }

      db.zgloszenia.reverse().forEach(z => {
        container.innerHTML += `
          <div class="notif-box">
            <strong>${z.kierowca}</strong> [${z.czas}]: <span style="color: var(--accent);">${z.typ}</span>
          </div>
        `;
      });
    }

    function odswiez() {
      const db = getDB();
      const select = document.getElementById('g-kierowca');
      select.innerHTML = '';
      Object.values(db.kierowcy).forEach(k => {
        select.innerHTML += `<option value="${k.login}">${k.nazwa}</option>`;
      });
      odswiezZgloszenia();
    }

    odswiez();
  </script>
</body>
</html>
