<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rozkład Kierowcy</title>
  
  <!-- Ustawienia PWA (Dodawanie do ekranu głównego) -->
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIlJvemtsYWQgS2llcm93Y3kiLAogICJzaG9ydF9uYW1lIjogIks=" />

  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #121212; 
      color: #ffffff; 
      margin: 0; 
      padding: 16px; 
    }
    header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 10px;
    }
    h1 { margin: 0; font-size: 24px; color: #4CAF50; }
    h2 { margin: 5px 0 0 0; font-size: 14px; color: #888; font-weight: normal; }
    
    .status-bar {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card { 
      background: #1e1e1e; 
      border-left: 4px solid #4CAF50;
      padding: 16px; 
      margin-bottom: 12px; 
      border-radius: 8px; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card.done {
      border-left-color: #2196F3;
      opacity: 0.6;
    }
    .card-info h3 { margin: 0 0 4px 0; font-size: 18px; }
    .card-info p { margin: 0; font-size: 14px; color: #aaa; }
    
    .btn { 
      background: #4CAF50; 
      color: white; 
      border: none; 
      padding: 10px 16px; 
      font-size: 14px; 
      font-weight: bold;
      border-radius: 6px; 
      cursor: pointer; 
    }
    .btn:disabled { background: #333; color: #777; cursor: default; }
    .btn-notif { background: #FF9800; padding: 8px 12px; font-size: 12px; }
  </style>
</head>
<body>

  <header>
    <h1 id="numer-linii">Ładowanie...</h1>
    <h2 id="relacja-linii">Proszę czekać</h2>
  </header>

  <div class="status-bar">
    <span>Powiadomienia PUSH:</span>
    <button id="btn-powiadomienia" class="btn btn-notif" onclick="wlaczPowiadomienia()">Włącz</button>
  </div>

  <div id="lista-przystankow">Wczytywanie trasy z Firebase...</div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>

  <script>
    // Konfiguracja Twojego projektu w Firebase
    const firebaseConfig = {
      projectId: "drobin-apka",
      authDomain: "drobin-apka.firebaseapp.com",
      storageBucket: "drobin-apka.appspot.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Pobieranie trasy z bazy
    db.collection("linie").doc("linia_161").get().then((doc) => {
      if (doc.exists) {
        const dane = doc.data();
        document.getElementById("numer-linii").innerText = "Linia " + dane.numer_linii;
        document.getElementById("relacja-linii").innerText = dane.relacja;
        
        let html = "";
        dane.przystanki.forEach((p, index) => {
          html += `
            <div class="card" id="przystanek-${index}">
              <div class="card-info">
                <h3>${p.kolejnosc}. ${p.nazwa}</h3>
                <p>Czas dojazdu: ${p.czas_minut}</p>
              </div>
              <button class="btn" onclick="zaliczPrzystanek(${index})">Zalicz</button>
            </div>
          `;
        });
        document.getElementById("lista-przystankow").innerHTML = html;
      } else {
        document.getElementById("lista-przystankow").innerText = "Nie znaleziono linii w bazie danych!";
      }
    });

    // Oznaczanie przystanku jako zaliczony
    function zaliczPrzystanek(index) {
      const card = document.getElementById(`przystanek-${index}`);
      const btn = card.querySelector("button");
      
      card.classList.add("done");
      btn.innerText = "Zaliczono ✓";
      btn.disabled = true;
    }

    // Prośba o zgodę na powiadomienia na telefonie
    function wlaczPowiadomienia() {
      Notification.requestPermission().then((permission) => {
        const btn = document.getElementById("btn-powiadomienia");
        if (permission === "granted") {
          btn.innerText = "Aktywne ✓";
          btn.style.background = "#4CAF50";
          btn.disabled = true;
          alert("Powiadomienia zostały włączone!");
        } else {
          alert("Brak zgody na powiadomienia w przeglądarce.");
        }
      });
    }

    // Rejestracja Service Workera dla aplikacji PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {
        // Ignoruj błąd jeśli plik sw.js jeszcze nie istnieje
      });
    }
  </script>
</body>
</html>
