<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Drobin Urbanow MPK - Mobile</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151b26;
      --accent: #ff8c00;
      --text: #f0f6fc;
      --text-dim: #8b949e;
      --border: #212936;
      --green: #2ea043;
      --red: #da3633;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    html, body {
      width: 100vw; height: 100dvh; background-color: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden;
    }

    /* AUTOMATYCZNE DOPASOWANIE DO SYSTEMÓW */
    .app-viewport {
      display: flex; width: 100vw; height: 100dvh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    /* EKRAN LOGOWANIA */
    #login-screen {
      position: fixed; inset: 0; background: var(--bg); z-index: 2000;
      display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .login-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
      padding: 25px; width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .login-card h2 { color: var(--accent); font-size: 20px; margin-bottom: 5px; }
    .input-field, .select-field {
      width: 100%; padding: 12px; margin: 10px 0; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 13px;
    }

    /* NOCNY / NOWOCZESNY LAYOUT APLIKACJI */
    #main-layout { display: none; width: 100vw; height: 100dvh; }

    /* BOCZNE MENU NAWIGACJI */
    .sidebar-menu {
      width: 260px; background: var(--card-bg); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; justify-content: space-between; padding: 15px;
    }
    .nav-item {
      padding: 12px; border-radius: 8px; color: var(--text-dim); font-weight: bold;
      font-size: 13px; margin-bottom: 6px; cursor: pointer; display: flex; align-items: center; gap: 10px;
    }
    .nav-item.active { background: var(--accent); color: #000; }

    /* GŁÓWNY PULPIT DASHBOARD */
    .content-area { flex: 1; display: flex; flex-direction: column; padding: 15px; overflow-y: auto; gap: 15px; }

    .welcome-card {
      background: linear-gradient(135deg, #1f2937, #111827); border: 1px solid var(--border);
      border-radius: 12px; padding: 15px; display: flex; justify-content: space-between; align-items: center;
    }

    /* DUŻY ROZCIĄGNIĘTY GRAFIK MIESIĘCZNY */
    .calendar-container {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; flex: 1;
    }
    .calendar-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 10px;
    }
    .day-box {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px; min-height: 65px; display: flex; flex-direction: column; justify-content: space-between; font-size: 11px;
    }
    .day-box.work { border-color: var(--accent); background: #1c170f; }
    .day-box.free { border-color: var(--green); background: #0e1a12; }

    /* EKRAN JAZDY TRASY */
    #drive-screen { display: none; width: 100%; height: 100%; flex-direction: column; gap: 10px; }
    .stops-scroll { flex: 1; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; overflow-y: auto; }
    .stop-row { padding: 10px; background: var(--bg); border-radius: 6px; margin-bottom: 6px; border-left: 4px solid var(--border); display: flex; justify-content: space-between; }
    .stop-row.active { border-left-color: var(--accent); background: #1f1a10; }

    /* PRZYCISKI AKCJI */
    .btn { background: var(--accent); color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; }
    .btn-secondary { background: var(--border); color: #fff; }
    .btn-red { background: var(--red); color: #fff; }
  </style>
</head>
<body>

  <!-- OKNO LOGOWANIA -->
  <div id="login-screen">
    <div class="login-card">
      <h2>Drobin MPK</h2>
      <p style="font-size: 11px; color: var(--text-dim);">Portal Kierowcy v2.0</p>
      
      <input type="text" id="l-user" class="input-field" placeholder="Login kierowcy...">
      
      <label style="font-size: 11px; color: var(--text-dim); text-align: left; display: block;">Twój Urządzenie / System:</label>
      <select id="l-system" class="select-field">
        <option value="android">📱 Android</option>
        <option value="ios">🍎 iPhone (iOS)</option>
        <option value="pc">💻 Komputer PC</option>
      </select>

      <button class="btn" style="width: 100%; margin-top: 10px;" onclick="zaloguj()">Zaloguj i Włącz Powiadomienia</button>
    </div>
  </div>

  <!-- APLIKACJA GŁÓWNA Z MENU -->
  <div id="main-layout" class="app-viewport">
    <!-- MENUBAR PO BOKU -->
    <div class="sidebar-menu">
      <div>
        <h3 style="color: var(--accent); font-size: 16px; margin-bottom: 20px;">MPK Mobile</h3>
        <div class="nav-item active" onclick="pokazWidok('dashboard')">📅 Miesięczny Grafik</div>
        <div class="nav-item" onclick="pokazWidok('dzis')">🚍 Dzisiejszy Kurs</div>
      </div>

      <div>
        <button class="btn btn-secondary" style="width: 100%; margin-bottom: 8px; font-size: 11px;" onclick="otworzZgloszenie()">PROŚBA / ZMIANA</button>
        <button class="btn btn-red" style="width: 100%; font-size: 11px;" onclick="wyloguj()">Wyloguj</button>
      </div>
    </div>

    <!-- PRAWY OBSZAR APLIKACJI -->
    <div class="content-area">
      
      <!-- POWITANIE & KALENDARZ -->
      <div id="view-dashboard" style="display: flex; flex-direction: column; gap: 15px; height: 100%;">
        <div class="welcome-card">
          <div>
            <h2 id="w-name" style="font-size: 18px;">Witaj, Kierowco!</h2>
            <p id="w-date" style="font-size: 12px; color: var(--text-dim);">Dzisiaj jest: --.--.2026 | Godzina: --:--</p>
          </div>
          <button class="btn" onclick="pokazWidok('dzis')">Rozpocznij Dzisiejszy Kurs ➔</button>
        </div>

        <div class="calendar-container">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="font-size: 14px; color: var(--accent);">Twój Rozszerzony Grafik na Sierpień 2026</h3>
            <span style="font-size: 10px; color: var(--text-dim);">🟡 Służba | 🟢 Wolne</span>
          </div>
          <div class="calendar-grid" id="cal-grid"></div>
        </div>
      </div>

      <!-- EKRAN JAZDY -->
      <div id="view-drive" style="display: none; height: 100%; flex-direction: column; gap: 10px;">
        <div class="welcome-card" style="padding: 10px;">
          <div>
            <span style="font-size: 10px; color: var(--text-dim);">AKTYWNA LINIA:</span>
            <h3 id="d-line" style="color: var(--accent);">Linia --</h3>
          </div>
          <div style="text-align: right;">
            <span style="font-size: 10px; color: var(--text-dim);">CZAS DO PRZYSTANKU:</span>
            <h2 id="d-timer" style="color: var(--green); font-family: monospace;">00:00</h2>
          </div>
        </div>

        <div class="stops-scroll" id="d-stops"></div>

        <!-- PRZYCISKI PROŚBY I DODATKOWEGO KURSU -->
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary" style="flex: 1; font-size: 11px;" onclick="prosbaOZmiane()">⚠️ Prośba o Zmianę / Wolne</button>
          <button class="btn btn-secondary" style="flex: 1; font-size: 11px;" onclick="dodatkowyKurs()">➕ Prośba o Dodatkowy Kurs</button>
        </div>

        <div style="display: flex; gap: 10px;">
          <button id="btn-start" class="btn" style="flex: 1;" onclick="startJazda()">ZACZNIJ KURS</button>
          <button id="btn-next" class="btn btn-secondary" style="flex: 1;" onclick="nastPrzystanek()" disabled>NASTĘPNY PRZYSTANEK ✓</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    let uzytkownik = null;
    let aktywneKonto = null;
    let dzisiejszaSluzba = null;
    let indexPrzystanku = 0;
    let timerInt = null;
    let czasSek = 0;

    // Aktualizacja zegara na żywo
    setInterval(() => {
      const now = new Date();
      document.getElementById('w-date').innerText = `Dzisiaj: ${now.toLocaleDateString()} | Godzina: ${now.toLocaleTimeString()}`;
    }, 1000);

    function zaloguj() {
      const login = document.getElementById('l-user').value.trim().toLowerCase();
      const sys = document.getElementById('l-system').value;
      const db = JSON.parse(localStorage.getItem('mpk_db_v2')) || { kierowcy: {} };

      if(!db.kierowcy[login]) return alert('Brak konta! Poproś dyspozytora w panel.html o jego utworzenie.');

      uzytkownik = db.kierowcy[login];
      aktywneKonto = login;

      // Obsługa powiadomień w przeglądarce
      if ("Notification" in window) {
        Notification.requestPermission();
      }

      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main-layout').style.display = 'flex';
      document.getElementById('w-name').innerText = `Witaj, ${uzytkownik.nazwa}!`;

      generujKalendarz();
    }

    function wyloguj() {
      document.getElementById('main-layout').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
    }

    function pokazWidok(v) {
      document.getElementById('view-dashboard').style.display = v === 'dashboard' ? 'flex' : 'none';
      document.getElementById('view-drive').style.display = v === 'dzis' ? 'flex' : 'none';
      if(v === 'dzis') zaladujDzisiejszyKurs();
    }

    function generujKalendarz() {
      const db = JSON.parse(localStorage.getItem('mpk_db_v2'));
      const grafiki = (db.grafiki && db.grafiki[aktywneKonto]) ? db.grafiki[aktywneKonto] : {};
      const grid = document.getElementById('cal-grid');
      grid.innerHTML = '';

      for(let i=1; i<=31; i++) {
        const g = grafiki[i];
        grid.innerHTML += `
          <div class="day-box ${g ? 'work' : 'free'}">
            <strong>Dzień ${i}</strong>
            <span style="font-size: 9px; font-weight: bold; margin-top: 4px;">${g ? 'Linia ' + g.linia : 'WOLNE'}</span>
            <span style="font-size: 8px; color: var(--text-dim);">${g ? g.kolek + ' kółka' : 'Odpoczynek'}</span>
          </div>
        `;
      }
    }

    function zaladujDzisiejszyKurs() {
      const db = JSON.parse(localStorage.getItem('mpk_db_v2'));
      const dzisDzien = new Date().getDate(); // Pobiera dzisiejszy dzień
      dzisiejszaSluzba = (db.grafiki && db.grafiki[aktywneKonto]) ? db.grafiki[aktywneKonto][dzisDzien] : null;

      const container = document.getElementById('d-stops');
      container.innerHTML = '';

      if(!dzisiejszaSluzba) {
        document.getElementById('d-line').innerText = 'Brak służby na dziś';
        container.innerHTML = '<div style="text-align: center; color: var(--text-dim); margin-top: 20px;">Masz dzisiaj wolne! Masz czas na odpoczynek.</div>';
        document.getElementById('btn-start').disabled = true;
        return;
      }

      const liniaInfo = db.linie[dzisiejszaSluzba.linia];
      document.getElementById('d-line').innerText = `Linia ${liniaInfo.numer} (${liniaInfo.relacja})`;
      document.getElementById('btn-start').disabled = false;

      liniaInfo.przystanki.forEach((p, idx) => {
        container.innerHTML += `
          <div class="stop-row ${idx === 0 ? 'active' : ''}">
            <span><strong>${idx+1}. ${p.nazwa}</strong></span>
            <span style="font-size: 11px; color: var(--text-dim);">${p.czas_sek}s</span>
          </div>
        `;
      });
    }

    function wyslijPowiadomienie(tytul, tresc) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(tytul, { body: tresc });
      }
    }

    function startJazda() {
      document.getElementById('btn-start').disabled = true;
      document.getElementById('btn-next').disabled = false;
      wyslijPowiadomienie("MPK Drobin", "Rozpoczęto kurs! Szerokiej drogi.");
    }

    function prosbaOZmiane() {
      alert("Wysłano prośbę do dyspozytora o zmianę linii / udzielenie wolnego.");
    }

    function dodatkowyKurs() {
      alert("Zgłoszono chęć wzięcia dodatkowego kursu! Dyspozytor przydzieli go w panelu.");
    }
  </script>
</body>
</html>
