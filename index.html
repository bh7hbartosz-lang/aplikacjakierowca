<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Drobin Urbanow MPK - Kierowca</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    html, body {
      width: 100%;
      height: 100dvh; /* Używamy dvh (dynamic viewport height) specjalnie pod telefony */
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    /* Dopasowanie do wcięcia (Notcha) oraz pasków Safari/Chrome */
    #app {
      display: flex;
      width: 100vw;
      height: 100dvh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 5px);
      padding-left: env(safe-area-inset-left, 5px);
      padding-right: env(safe-area-inset-right, 5px);
    }

    /* EKRAN LOGOWANIA */
    #login-screen {
      position: fixed;
      inset: 0;
      background: #161b22;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    .login-card {
      background: #21262d;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #30363d;
      width: 280px;
      text-align: center;
    }
    .login-card h2 { color: #f28c28; font-size: 16px; margin-bottom: 4px; }
    .login-card p { color: #8b949e; font-size: 11px; margin-bottom: 12px; }
    .input-field {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
    }

    /* LEWA STRONA (GRAFIK) */
    .sidebar {
      width: 28%;
      background: #161b22;
      border-right: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      padding: 6px;
      gap: 6px;
      overflow-y: auto;
    }
    .driver-info {
      padding: 6px;
      background: #21262d;
      border-radius: 6px;
      border-left: 3px solid #f28c28;
    }
    .driver-info h3 { font-size: 11px; color: #fff; }
    .driver-info p { font-size: 9px; color: #8b949e; }

    .schedule-title { font-size: 9px; font-weight: bold; color: #8b949e; text-transform: uppercase; }

    .route-card {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px;
      cursor: pointer;
    }
    .route-card.active { border-color: #f28c28; background: #2b3038; }
    .route-badge {
      background: #f28c28;
      color: #000;
      font-weight: bold;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 10px;
      display: inline-block;
    }

    /* PRAWA STRONA (EKRAN JAZDY) */
    .main-content {
      width: 72%;
      display: flex;
      flex-direction: column;
      background: #0d1117;
      padding: 6px;
      gap: 6px;
    }

    .top-bar {
      background: #161b22;
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 6px;
      border: 1px solid #30363d;
      min-height: 28px;
    }
    .clock-box { font-family: monospace; font-size: 14px; font-weight: bold; color: #2ea043; }

    .timer-box {
      background: #21262d;
      border-radius: 6px;
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #30363d;
    }

    .stops-container {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px;
      flex: 1; /* Wypełnia wolną przestrzeń */
      overflow-y: auto; /* Daje możliwość przewijania listy przystanków */
    }

    .stop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      background: #21262d;
      border-radius: 4px;
      margin-bottom: 4px;
      border-left: 3px solid #58a6ff;
    }
    .stop-item.current { border-left-color: #f28c28; background: #2d333b; }
    .stop-item.passed { border-left-color: #2ea043; opacity: 0.4; }

    /* DOLNE PRZYCISKI - MOCNE I WIDOCZNE */
    .action-buttons {
      display: flex;
      gap: 6px;
      min-height: 38px;
    }

    .btn {
      background: #f28c28;
      color: #000;
      border: none;
      padding: 8px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:disabled { background: #21262d; color: #555; border: 1px solid #30363d; }
  </style>
</head>
<body>

  <!-- OKNO LOGOWANIA -->
  <div id="login-screen">
    <div class="login-card">
      <h2>Drobin Urbanow MPK</h2>
      <p>System Kierowcy v1.2</p>
      <input type="text" id="driver-id" class="input-field" placeholder="Podaj Login Kierowcy...">
      <button class="btn" style="width: 100%" onclick="zaloguj()">Zaloguj do Służby</button>
    </div>
  </div>

  <!-- APLIKACJA GŁÓWNA -->
  <div id="app">
    <!-- LEWY PANEL -->
    <div class="sidebar">
      <div class="driver-info">
        <h3 id="disp-driver-id">Kierowca: -</h3>
        <p id="disp-status">Status: Na zajezdni</p>
      </div>
      <div class="schedule-title">Grafik:</div>
      <div id="schedule-list"></div>
    </div>

    <!-- PRAWY PANEL -->
    <div class="main-content">
      <div class="top-bar">
        <div>
          <span style="color: #8b949e; font-size: 10px;">LINIA:</span>
          <strong id="active-line-name" style="color: #f28c28; font-size: 12px; margin-left: 4px;">Wybierz z grafiku</strong>
        </div>
        <div class="clock-box" id="live-clock">00:00:00</div>
      </div>

      <div class="timer-box">
        <div>
          <span style="font-size: 9px; color: #8b949e; display: block;">POSTĘP KÓŁEK:</span>
          <strong id="lap-counter" style="font-size: 12px; color: #58a6ff;">0 / 0</strong>
        </div>
        <div style="text-align: right;">
          <span style="font-size: 9px; color: #8b949e; display: block;">DO PRZYSTANKU:</span>
          <strong id="stop-timer" style="font-size: 15px; color: #2ea043;">00:00</strong>
        </div>
      </div>

      <div class="stops-container" id="stops-list">
        <div style="text-align: center; color: #8b949e; margin-top: 10px; font-size: 11px;">Wybierz linię po lewej stronie</div>
      </div>

      <div class="action-buttons">
        <button id="btn-start" class="btn" style="flex: 1;" onclick="startKurs()" disabled>ZACZNIJ KURS</button>
        <button id="btn-next-stop" class="btn" style="flex: 1.2; background: #21262d; color: #fff; border: 1px solid #30363d;" onclick="zaliczPrzystanek()" disabled>NASTĘPNY PRZYSTANEK ✓</button>
      </div>
    </div>
  </div>

  <script>
    const mockData = {
      "kierowca1": {
        nazwa: "Jan Kowalski (102)",
        linie: [
          {
            numer: "161",
            relacja: "Zakładowa MPK ➔ Rondo Legionów",
            kolek: 4,
            przystanki: [
              { nazwa: "Zakładowa MPK", czas_sek: 0 },
              { nazwa: "Plac Wolności", czas_sek: 90 },
              { nazwa: "Reja", czas_sek: 60 },
              { nazwa: "Rondo Legionów Polskich", czas_sek: 120 }
            ]
          }
        ]
      }
    };

    let aktualnyKierowca = null;
    let wybralLinia = null;
    let aktywneKolko = 1;
    let aktualnyPrzystanekIndex = 0;
    let timerInterval = null;
    let pozostalyCzas = 0;

    setInterval(() => {
      document.getElementById('live-clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    function zaloguj() {
      const id = document.getElementById('driver-id').value.trim();
      if (!id) return alert('Wpisz login!');

      aktualnyKierowca = mockData[id] || {
        nazwa: id,
        linie: [
          {
            numer: "161",
            relacja: "Zakładowa MPK ➔ Rondo Legionów",
            kolek: 4,
            przystanki: [
              { nazwa: "Zakładowa MPK", czas_sek: 0 },
              { nazwa: "Plac Wolności", czas_sek: 90 },
              { nazwa: "Reja", czas_sek: 60 },
              { nazwa: "Rondo Legionów Polskich", czas_sek: 120 }
            ]
          }
        ]
      };

      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('disp-driver-id').innerText = aktualnyKierowca.nazwa;
      pobierzGrafik();
    }

    function pobierzGrafik() {
      const container = document.getElementById('schedule-list');
      container.innerHTML = '';
      aktualnyKierowca.linie.forEach((linia, idx) => {
        container.innerHTML += `
          <div class="route-card" onclick="wybierzLinie(${idx})">
            <span class="route-badge">Linia ${linia.numer}</span>
            <div style="font-size: 10px; margin-top: 3px; font-weight: bold;">${linia.relacja}</div>
            <div style="font-size: 9px; color: #8b949e;">Kółka: ${linia.kolek}</div>
          </div>
        `;
      });
    }

    function wybierzLinie(idx) {
      wybralLinia = aktualnyKierowca.linie[idx];
      document.getElementById('active-line-name').innerText = `Linia ${wybralLinia.numer}`;
      document.getElementById('lap-counter').innerText = `1 / ${wybralLinia.kolek}`;
      document.getElementById('btn-start').disabled = false;
      wyswietlPrzystanki();
    }

    function wyswietlPrzystanki() {
      const container = document.getElementById('stops-list');
      container.innerHTML = '';
      wybralLinia.przystanki.forEach((p, index) => {
        let statusClass = '';
        if (index < aktualnyPrzystanekIndex) statusClass = 'passed';
        if (index === aktualnyPrzystanekIndex) statusClass = 'current';

        container.innerHTML += `
          <div class="stop-item ${statusClass}">
            <div>
              <strong style="font-size: 11px;">${index + 1}. ${p.nazwa}</strong>
              <div style="font-size: 9px; color: #8b949e;">Czas: ${p.czas_sek}s</div>
            </div>
            <div style="font-size: 10px; font-weight: bold;">
              ${index === aktualnyPrzystanekIndex ? '⬅ OBECNY' : ''}
            </div>
          </div>
        `;
      });
    }

    function startKurs() {
      document.getElementById('btn-start').disabled = true;
      document.getElementById('btn-next-stop').disabled = false;
      document.getElementById('disp-status').innerText = "Status: W trasie";
      startTimerForStop();
    }

    function startTimerForStop() {
      clearInterval(timerInterval);
      const nastepnyIndex = aktualnyPrzystanekIndex + 1;
      pozostalyCzas = nastepnyIndex < wybralLinia.przystanki.length ? wybralLinia.przystanki[nastepnyIndex].czas_sek : 0;

      updateTimerDisplay();
      timerInterval = setInterval(() => {
        if (pozostalyCzas > 0) {
          pozostalyCzas--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const min = Math.floor(pozostalyCzas / 60);
      const sec = pozostalyCzas % 60;
      document.getElementById('stop-timer').innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
    }

    function zaliczPrzystanek() {
      if (aktualnyPrzystanekIndex < wybralLinia.przystanki.length - 1) {
        aktualnyPrzystanekIndex++;
        wyswietlPrzystanki();
        startTimerForStop();
      } else {
        clearInterval(timerInterval);
        if (aktywneKolko < wybralLinia.kolek) {
          alert(`Koniec kółka ${aktywneKolko}! Start kółka ${aktywneKolko + 1}.`);
          aktywneKolko++;
          aktualnyPrzystanekIndex = 0;
          document.getElementById('lap-counter').innerText = `${aktywneKolko} / ${wybralLinia.kolek}`;
          wyswietlPrzystanki();
          startTimerForStop();
        } else {
          alert('Grafik zrobiony!');
          document.getElementById('btn-next-stop').disabled = true;
          document.getElementById('disp-status').innerText = "Status: Zakończono";
        }
      }
    }
  </script>
</body>
</html>
